<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>渠道中心数据采集</title>
  <style>
    body { width: 320px; margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; color: #333; }
    .header { background: #0f6bff; color: #fff; padding: 12px 14px; font-weight: 600; font-size: 14px; }
    .body { padding: 12px 14px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; }
    .row:last-child { border-bottom: none; }
    .label { color: #888; }
    .badge { background: #e6f4ff; color: #0958d9; border-radius: 4px; padding: 1px 8px; }
    .ok { color: #52c41a; } .err { color: #cf1322; } .warn { color: #d46b08; }
    .btn { display: inline-block; width: 100%; margin-top: 10px; padding: 8px 0; text-align: center; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-primary { background: #0f6bff; color: #fff; }
    .btn-primary:disabled { background: #c0c0c0; cursor: not-allowed; }
    .btn-ghost { background: #f0f0f0; color: #333; }
    .result { margin-top: 10px; padding: 8px; background: #f6f8fa; border-radius: 6px; font-size: 12px; line-height: 1.7; word-break: break-all; }
    .footer { padding: 8px 14px 10px; text-align: right; }
    .footer a { color: #0f6bff; text-decoration: none; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">渠道中心数据采集器</div>
  <div class="body">
    <div class="row"><span class="label">当前页面</span><span id="page">检测中…</span></div>
    <div class="row"><span class="label">数据源</span><span id="source">-</span></div>
    <div class="row"><span class="label">已捕获表格</span><span id="count">0</span></div>
    <div class="row"><span class="label">配置状态</span><span id="cfg">检测中…</span></div>
    <div class="row"><span class="label">自动上传</span><span id="auto">-</span></div>
    <div class="row"><span class="label">待上传</span><span id="pending">0</span></div>

    <button id="uploadBtn" class="btn btn-primary">立即采集并上传</button>
    <button id="optionsBtn" class="btn btn-ghost">打开选项配置</button>

    <div class="result" id="result" style="display:none"></div>
  </div>
  <div class="footer"><a href="#" id="optsLink">配置渠道中心地址 / store_id / sync_token</a></div>
  <script src="popup.js"></script>
</body>
</html>
